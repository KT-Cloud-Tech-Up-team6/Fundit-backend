plugins {
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

allprojects {
    group = 'com.fundit'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

// 모든 서브모듈 공통 설정
subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'jacoco'

    java {
        toolchain {
            // 워크플로우의 java-version과 반드시 일치해야 함
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    jacoco {
        toolVersion = '0.8.14'
    }

    ext {
        set('springCloudVersion', '2025.1.2')
        set('springModulithVersion', "2.1.0")
        // ponytail: 보안 패치(SAST 1·6, #220) — Boot BOM 속성 덮어쓰기. Boot 4.1.x GA가 이 버전 이상을 관리하면 두 줄 제거
        // 주의: Boot 4.1.1이 검증한 조합(Tomcat 11.0.24·Netty 4.2.17)이 아니다 — #220 로컬 스모크(auth·gateway)로만 확인. 기동·통신 이상 시 먼저 의심할 것
        // (mavenBom의 bomProperty는 Boot 플러그인이 같은 BOM을 따로 import해서 적용되지 않는다)
        set('tomcat.version', '11.0.26')      // CVE-2026-65637, 11.0.20~11.0.24 영향
        set('netty.version', '4.2.18.Final')  // CVE-2026-89044 (gateway 요청 스머글링)
    }

    // Spring Boot / Spring Cloud BOM으로 의존성 버전을 일괄 관리 (각 서비스에서 버전 명시 불필요)
    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:4.1.1"
            mavenBom "org.springframework.modulith:spring-modulith-bom:${springModulithVersion}"
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        }
    }

    // -------------------------------------------------------
    // 아래 의존성은 모든 서비스에 자동 적용됩니다.
    // 각 서비스 build.gradle에 중복 선언하지 않아도 됩니다.
    //
    //  - spring-boot-starter-test : JUnit 5, Mockito 포함
    //  - lombok                   : compileOnly + annotationProcessor 모두 적용
    // -------------------------------------------------------
    dependencies {
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
    }

    tasks.named('test') {
        useJUnitPlatform()
        finalizedBy tasks.jacocoTestReport
    }

    tasks.named('jacocoTestReport') {
        dependsOn tasks.test
        reports {
            xml.required = true
            html.required = true
        }
    }

    tasks.named('check') {
        dependsOn tasks.jacocoTestReport
    }

    // -------------------------------------------------------
    // 주의: Gradle 기본 동작상 check 태스크에 자동으로 안 물리므로,
    // 켤 때 `tasks.named('check') { dependsOn tasks.jacocoTestCoverageVerification }`도 같이 추가해야 실제로 강제됩니다.
    // -------------------------------------------------------
     tasks.named('jacocoTestCoverageVerification') {
         violationRules {
             rule {
                 limit {
                     minimum = 0.80
                 }
             }
         }
     }
}

// Spring Boot 플러그인은 실행 가능한 JAR이 필요한 서비스에만 적용
// modules:common은 라이브러리이므로 제외
configure(subprojects.findAll {
    it.path.startsWith(':services:') || it.path.startsWith(':platform:')
}) {
    apply plugin: 'org.springframework.boot'
}

// modules:* 는 다른 프로젝트가 갖다 쓰는 라이브러리이므로 java-library 적용
// (java 플러그인만으론 api 설정이 없어서, 자기 의존성을 밖으로 노출(api)시킬 수 없음)
configure(subprojects.findAll { it.path.startsWith(':modules:') }) {
    apply plugin: 'java-library'
}

// TestContainers, Flyway, JPA, PostgreSQL은 모든 서비스에 적용
// platform, modules는 DB가 없기에 제외
configure(subprojects.findAll { it.path.startsWith(':services:') }) {
    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
        runtimeOnly 'org.postgresql:postgresql'
        // 배포 헬스체크(/actuator/health)·메트릭(/actuator/prometheus)용. platform:gateway-service는 자체 build.gradle에 이미 있다.
        // 노출 범위는 각 서비스 application.yml, 관리 포트(8081)는 dev/prod yml에서만 정한다(#242).
        implementation 'org.springframework.boot:spring-boot-starter-actuator'
        runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
        implementation 'org.springframework.boot:spring-boot-starter-flyway'
        implementation 'org.flywaydb:flyway-database-postgresql'

        testImplementation 'org.springframework.boot:spring-boot-testcontainers'
        testImplementation platform('org.testcontainers:testcontainers-bom:2.0.4')
        testImplementation 'org.testcontainers:testcontainers-postgresql'
        testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    }
}

// 계층형 모듈 구조를 위한 bootJar task 선별 비활성화
// 해당 모듈에 스프링 부트 플러그인이 '실제로 존재할 때만' 내부 로직을 실행하도록 격리
subprojects {
    plugins.withType(org.springframework.boot.gradle.plugin.SpringBootPlugin) {
        tasks.named('bootJar') {
            enabled = childProjects.size() == 0
        }
    }
}