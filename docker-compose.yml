services:
  kafka:
    image: apache/kafka:4.2.1
    container_name: fundit-kafka
    ports:
      - "127.0.0.1:9092:9092"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - fundit-kafka-net

  # 로컬 메트릭 확인용(#242) — 필요할 때만: docker compose up -d prometheus grafana
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: fundit-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    # 호스트에서 bootRun한 서비스를 긁는다. Docker Desktop은 기본 제공, Linux는 이 줄이 있어야 한다
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles: [monitoring]
    networks:
      - fundit-monitoring-net

  grafana:
    image: grafana/grafana:13.2.3
    container_name: fundit-grafana
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./infra/monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    depends_on:
      - prometheus
    profiles: [monitoring]
    networks:
      - fundit-monitoring-net

networks:
  fundit-kafka-net:
  fundit-monitoring-net:
