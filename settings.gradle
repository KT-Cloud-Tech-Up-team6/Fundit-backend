rootProject.name = 'fundit-backend'

// 공통 라이브러리 모듈 — 각 서비스 JAR에 포함되어 배포됨
include 'modules:common'
include 'modules:common-webmvc'

// 마이크로서비스 — 폴더가 아직 스캐폴딩되지 않은 서비스는 자동 스킵됨
// 서비스 추가 시 아래 배열에 이름만 추가하면 include 됨
['auth-service', 'member-service', 'order-service', 'payment-service'].each { svc ->
    if (file("services/${svc}").exists()) {
        include "services:${svc}"
    }
}

// 플랫폼 모듈 — 도메인 서비스가 아닌 인프라성 애플리케이션(게이트웨이 등).
// 루트 build.gradle의 :services: 전용 블록(JPA/Flyway/Testcontainers)은 적용되지 않는다 — DB가 없다.
['gateway-service'].each { svc ->
    if (file("platform/${svc}").exists()) {
        include "platform:${svc}"
    }
}