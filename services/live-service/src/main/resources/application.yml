server:
  port: 8080

spring:
  application:
    name: live-service
  profiles:
    active: local
  jackson:
    default-property-inclusion: non_null

  kafka:
    producer:
      # 발행 전용이다. 구독하는 토픽이 없다 —
      # 방송 종료 후 AI 트리거(live.ended.v1)와 질문요약을 밖으로 내보내기만 한다.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

live:
  outbox:
    # 아웃박스 워커 폴링 주기. 방송 종료 이벤트가 AI 생성의 유일한 트리거라
    # 너무 길면 종료 후 자산 생성이 그만큼 늦어진다.
    poll-interval-ms: 5000
    batch-size: 50
  ivs:
    # stub | aws — 자격증명이 내려오기 전까지 stub이 기본값이다.
    # aws로 바꾸면 AwsIvsClient가 뜨고 실제 채널을 프로비저닝한다.
    mode: stub
    region: ap-northeast-2
    # SDK 호출 1회 시도 타임아웃(ms). 전체 호출(재시도 포함)은 이 값의 2배까지 기다린다.
    api-timeout-ms: 3000
  vod:
    # 다시보기 URL 앞부분(#222). 녹화 완료 이벤트의 HLS 경로를 붙여 CloudFront /ivs/* 로 재생한다.
    # 기본값은 dev CloudFront 도메인이다. 다른 도메인이 필요하면 환경변수로 덮는다.
    cdn-base-url: ${LIVE_VOD_CDN_BASE_URL:https://infrastudy.store}
  recording:
    # 녹화 완료 이벤트 큐(EventBridge → SQS, #222). 비면 폴러가 뜨지 않는다(로컬·테스트).
    queue-url: ${LIVE_RECORDING_QUEUE_URL:}
    # 녹화 완료는 드문 이벤트라 짧은 폴링으로 충분하다(롱 폴링은 단일 스케줄러 스레드를 붙잡는다).
    poll-interval-ms: 5000
  ai:
    # stub | http — AI 서버 주소·계약이 확정되기 전까지 stub이다.
    # 값이 없으면 스텁도 안 뜬다(matchIfMissing=false) — 여기 기본값이 그 안전망이다.
    mode: stub
    # 댓글 배치 전송 주기. AI팀 권장치(3초)를 그대로 쓴다.
    comments-poll-interval-ms: 3000
  cuesheet-ai:
    # 커밋 후~AI 호출 사이 서버가 죽으면 GENERATING이 영영 안 풀린다 — 이 시간을 넘기면
    # 스윕 워커가 FAILED로 풀어 재생성 버튼을 다시 누를 수 있게 한다.
    # 200초(읽기 타임아웃) + 여유.
    stale-after-ms: 240000
    recovery-interval-ms: 60000

springdoc:
  api-docs:
    path: /api/v1/lives/api-docs

# 메트릭(#242). 관리 포트는 application-dev/prod.yml에서만 8081로 분리한다 — 로컬은 앱 포트를 같이 쓴다.
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      # Grafana Spring Boot 대시보드가 이 라벨로 서비스를 구분한다
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        # p95·p99 응답 시간을 보려면 히스토그램 버킷이 필요하다
        "[http.server.requests]": true
