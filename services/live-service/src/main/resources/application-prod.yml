spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

# 채팅 적재(/internal/v1/lives/chat/messages)와 방송 상태 조회가 내부 전용이라
# CommonWebConfig가 이 값을 주입받는다. 없으면 빈 생성 단계에서 기동이 실패한다.
internal-api:
  key: ${INTERNAL_API_KEY}

live:
  integration:
    project-service:
      # AI prepare/context 배선(리워드·프로젝트 정보 조회)에 쓴다. K8s Service 이름이
      # project-service가 아니면 주입이 필요하다 — 기본값은 로컬 개발용(localhost:8083)이라
      # 그대로 두면 운영에서 프로젝트 조회가 전부 실패한다(AI prepare/context만 영향, 방송 자체는 무관).
      base-url: ${PROJECT_SERVICE_BASE_URL:http://project-service:8080}
  ivs:
    # 기본값을 두지 않는다. 미설정이면 기동이 실패해야 한다 —
    # stub으로 흘러가면 가짜 ARN으로 방송이 "성공"하고 아무도 눈치채지 못한다.
    # AWS 구현이 붙으면 LIVE_IVS_MODE=aws를 주입한다.
    mode: ${LIVE_IVS_MODE}
  ai:
    # IVS와 같은 이유로 기본값을 두지 않는다. 미설정이면 기동이 실패한다 —
    # 스텁으로 흘러가면 큐시트·추천답변이 "[stub] ..." 문자열로 "성공"한다.
    mode: ${LIVE_AI_MODE}
    base-url: ${LIVE_AI_BASE_URL}
    # AI 서버가 Authorization: Bearer 헤더를 요구한다. 값이 없으면 헤더를 안 붙이는데,
    # 그건 AI 서버가 "개발 모드"(API_TOKEN 미설정)일 때만 통과하므로 운영에서는 반드시 채운다.
    token: ${LIVE_AI_TOKEN}

# 스펙은 공격자에게 좋은 지도라 운영에서는 닫는다. dev는 켜 둔다(프론트 전달용).
springdoc:
  api-docs:
    enabled: false
