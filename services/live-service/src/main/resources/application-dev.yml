spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

internal-api:
  key: ${INTERNAL_API_KEY}

live:
  integration:
    project-service:
      # AI prepare/context용 프로젝트 조회. 없으면 코드 기본값(localhost:8083)으로 붙어 dev에서 전부 실패한다.
      base-url: ${PROJECT_SERVICE_BASE_URL:http://project-service:8080}
    member-service:
      # 라이브 카드 판매자명 조회(내부 API). 실패해도 목록은 판매자명 없이 나간다.
      base-url: ${MEMBER_SERVICE_BASE_URL:http://member-service:8080}
  ivs:
    # 자격증명을 받았으면 LIVE_IVS_MODE=aws로 실연동한다. 미설정이면 stub.
    mode: ${LIVE_IVS_MODE:stub}
    # 스텁 모드 재생 QA용 테스트 영상(m3u8). 비어 있으면 스텁 기본 URL.
    stub-playback-url: ${LIVE_IVS_STUB_PLAYBACK_URL:}
    # 선택 — 녹화(S3)·채팅 로깅 설정. 비어 있으면 요청에서 뺀다.
    recording-configuration-arn: ${LIVE_IVS_RECORDING_CONFIG_ARN:}
    chat-logging-configuration-arn: ${LIVE_IVS_CHAT_LOGGING_CONFIG_ARN:}
