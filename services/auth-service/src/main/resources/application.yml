server:
  port: 8080

spring:
  application:
    name: auth-service
  profiles:
    active: local
  jackson:
    default-property-inclusion: non_null

portone:
  base-url: https://api.portone.io

identity-verification:
  token-ttl: 30m

# 제공자 공개 엔드포인트 — 환경마다 같은 값이라 여기 둔다.
# client-id/secret/redirect-uri는 환경별 yml에서 ${ENV}로 주입한다.
oauth:
  # 소셜 로그인에서 "가입 필요" 판정 후 가입 완료까지의 유예. 명세 AUTH-002 기준 10분.
  signup-token-ttl: 10m
  kakao:
    token-uri: https://kauth.kakao.com/oauth/token
    user-info-uri: https://kapi.kakao.com/v2/user/me
  google:
    token-uri: https://oauth2.googleapis.com/token
    user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo

springdoc:
  api-docs:
    path: /api/v1/auth/api-docs
