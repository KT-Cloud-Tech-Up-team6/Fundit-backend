server:
  port: 8080

spring:
  application:
    name: auth-service
  profiles:
    active: local
  jackson:
    default-property-inclusion: non_null

portone:
  base-url: https://api.portone.io

identity-verification:
  token-ttl: 30m

# 제공자 공개 엔드포인트 — 환경마다 같은 값이라 여기 둔다.
# client-id/secret/redirect-uri는 환경별 yml에서 ${ENV}로 주입한다.
oauth:
  # 소셜 로그인에서 "가입 필요"/"연동 필요" 판정 후 완료까지의 유예. 명세 AUTH-002 기준 10분.
  # 연동은 그 사이에 본인인증까지 해야 하므로 짧으면 사용자가 다시 시작해야 한다.
  pending-token-ttl: 10m
  kakao:
    token-uri: https://kauth.kakao.com/oauth/token
    user-info-uri: https://kapi.kakao.com/v2/user/me
  google:
    token-uri: https://oauth2.googleapis.com/token
    user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo

# 비밀번호 재설정(AUTH-010). 링크 방식이라 짧게 잡는다 — 메일함이 털렸을 때 창이 좁을수록 낫다.
password-reset:
  token-ttl: 30m
  # 로컬 프론트 기준. `%s` 자리에 토큰이 들어간다. 환경별 주소는 dev/prod yml이 덮는다.
  url-template: http://localhost:3000/reset-password?token=%s

mail:
  # log | (실구현 미정). 기본값을 두지 않는 건 운영 프로필이고, 여기 기본값이 로컬·개발용이다.
  mode: log

springdoc:
  api-docs:
    path: /api/v1/auth/api-docs
