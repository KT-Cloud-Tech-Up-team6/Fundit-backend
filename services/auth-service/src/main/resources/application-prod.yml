spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate

jwt:
  private-key: ${JWT_PRIVATE_KEY}
  access-token-ttl: 30m
  refresh-token-ttl: 14d

member-service:
  base-url: ${MEMBER_SERVICE_BASE_URL}

internal-api:
  key: ${INTERNAL_API_KEY}

portone:
  store-id: ${PG_STORE_ID}
  api-secret: ${PG_APIKEY}

# 스펙은 공격자에게 좋은 지도라 운영에서는 닫는다. dev는 켜 둔다(프론트 전달용).
springdoc:
  api-docs:
    enabled: false

oauth:
  kakao:
    client-id: ${KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRET}
    redirect-uri: ${KAKAO_REDIRECT_URI}
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    redirect-uri: ${GOOGLE_REDIRECT_URI}

auth:
  encryption:
    # 개인정보 컬럼 암호화 키(Base64 AES-256, 32바이트). 조회용 블라인드 인덱스도 같은 키를 쓴다.
    # 기본값을 두지 않는다 — 미설정이면 기동이 실패해야 한다. 임시 키로 흘러가면 기존 데이터를
    # 복호화하지 못하고, 그 사실을 저장 시점이 아니라 조회 시점에 알게 된다.
    key: ${AUTH_ENCRYPTION_KEY}
