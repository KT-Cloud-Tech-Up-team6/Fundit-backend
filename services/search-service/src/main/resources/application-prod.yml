spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

search:
  integration:
    live-service:
      # order-service가 이미 쓰는 것과 같은 환경변수다(파이프라인에 search-service용으로 추가 필요).
      base-url: ${LIVE_SERVICE_BASE_URL:http://live-service:8080}

internal-api:
  key: ${INTERNAL_API_KEY}

# 스펙은 공격자에게 좋은 지도라 운영에서는 닫는다. dev는 켜 둔다(프론트 전달용).
springdoc:
  api-docs:
    enabled: false

# 메트릭·헬스체크 전용 포트(#242). 인프라 PodMonitor·probe가 이 포트를 본다.
# application.yml에 두지 않는다 — 로컬에서 auth-service 앱 포트(8081)와 충돌한다.
management:
  server:
    port: 8081
