server:
  port: 8080

spring:
  application:
    name: order-service
  profiles:
    active: local
  jackson:
    default-property-inclusion: non_null

# ORDER-006/014가 발행하는 펀딩 이벤트(FundingGoalFailed/FundingSucceeded/FundingCancelledByMember)의
# 트랜잭셔널 아웃박스 워커 설정. project-service의 reward-event-outbox와 동일한 패턴.
funding-event-outbox:
  worker-enabled: true
  poll-interval-ms: 5000
  batch-size: 50

order:
  policy:
    # ORDER-013: 미결제 주문 자동 만료 유예시간(분). order-service CLAUDE.md
    # "정책값 확인 필요" 1번 항목 — PM 확정 전까지의 잠정값[가정].
    payment-expiry-minutes: 30
    # ORDER-002/003: project-service에 배송비 필드가 아직 없어(OrderDomainFunctionalSpec.md
    # ORDER-002 검토의견 참고) 프로젝트/리워드별 배송비 정책이 확정되기 전까지 쓰는
    # 임시 고정값(원)[가정]. 정책 확정 시 project-service 조회값으로 교체할 것.
    default-shipping-fee: 3000
    # ORDER-007 신규가입 자동발급 대상 쿠폰코드. 비워두면 자동 발급을 하지 않는다(기본값).
    welcome-coupon-code: ""
  integration:
    project-service:
      # base-url은 환경마다 달라(로컬/dev/운영) application-{profile}.yml에서 선언한다 —
      # 여기 공통 파일에 리터럴로 두면 dev/prod에서도 계속 localhost를 호출하는 버그가 된다.
      # 이 빈은 조건부(stub/http 스위치)가 아니라 항상 생성되므로, 프로필을 안 타는
      # 테스트 컨텍스트를 위한 기본값은 ProjectServiceClientConfig의 @Value 기본값으로 둔다.
      # security.md 규칙: 서비스 간 동기 호출에는 반드시 타임아웃을 둔다.
      connect-timeout-ms: 2000
      read-timeout-ms: 3000
