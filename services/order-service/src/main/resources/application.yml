server:
  port: 8080

spring:
  application:
    name: order-service
  profiles:
    active: local
  jackson:
    default-property-inclusion: non_null

# ORDER-006/014가 발행하는 펀딩 이벤트(FundingGoalFailed/FundingSucceeded/FundingCancelledByMember)의
# 트랜잭셔널 아웃박스 워커 설정. project-service의 reward-event-outbox와 동일한 패턴.
funding-event-outbox:
  worker-enabled: true
  poll-interval-ms: 5000
  batch-size: 50

# PROJECT-015 — 리워드 구매 통계. 평소 반영은 결제완료·취소·환불 시점의 즉시 재집계가 담당하고(#230),
# 아래 배치(매일 03:00 전체 재계산)는 이벤트 누락·발행 실패를 수습하는 안전망이다. + 발행 아웃박스.
funding-reward-stats-batch:
  cron: "0 0 3 * * *"
funding-reward-stats-event-outbox:
  worker-enabled: true
  poll-interval-ms: 5000
  batch-size: 50

order:
  policy:
    # ORDER-013: 미결제 주문 자동 만료 유예시간(분). order-service CLAUDE.md
    # "정책값 확인 필요" 1번 항목 — PM 확정 전까지의 잠정값[가정].
    payment-expiry-minutes: 30
    # ORDER-002/003: project-service에 배송비 필드가 아직 없어(OrderDomainFunctionalSpec.md
    # ORDER-002 검토의견 참고) 프로젝트/리워드별 배송비 정책이 확정되기 전까지 쓰는
    # 임시 고정값(원)[가정]. 정책 확정 시 project-service 조회값으로 교체할 것.
    default-shipping-fee: 3000
    # ORDER-007 신규가입 자동발급 대상 쿠폰코드. 비워두면 자동 발급을 하지 않는다(기본값).
    welcome-coupon-code: ""
  integration:
    project-service:
      # base-url은 환경마다 달라(로컬/dev/운영) application-{profile}.yml에서 선언한다 —
      # 여기 공통 파일에 리터럴로 두면 dev/prod에서도 계속 localhost를 호출하는 버그가 된다.
      # 이 빈은 조건부(stub/http 스위치)가 아니라 항상 생성되므로, 프로필을 안 타는
      # 테스트 컨텍스트를 위한 기본값은 ProjectServiceClientConfig의 @Value 기본값으로 둔다.
      # security.md 규칙: 서비스 간 동기 호출에는 반드시 타임아웃을 둔다.
      connect-timeout-ms: 2000
      read-timeout-ms: 3000
    fulfillment-service:
      # ORDER-005 availableActions() 판단용(V07) — project-service 클라이언트와 동일 패턴.
      connect-timeout-ms: 2000
      read-timeout-ms: 3000
    payment-service:
      # 펀딩 내역의 "신청 여부"(취소·반품·교환 신청 유무) 표시용 — 목록 부가 정보라 실패하면
      # 그 값 없이 목록을 내린다. fulfillment 연동과 동일한 타임아웃.
      connect-timeout-ms: 2000
      read-timeout-ms: 3000
    live-service:
      # 라이브 주문 꼬리표(fundings.live_session_id)·LIVE 쿠폰 검증용. 위 두 연동(2000/3000)보다
      # 짧은 이유: 이 호출은 주문 생성 경로에 물린다 — 라이브ID는 부가 정보라 느려질 바엔 포기한다.
      connect-timeout-ms: 1000
      read-timeout-ms: 1000
  # cross-service ID 통일(#69) 1회성 백필 스위치 — 기본 꺼짐. 운영에서 필요할 때만
  # ORDER_BACKFILL_FUNDING_PROJECT_PUBLIC_ID=true로 켜서 재기동 1회 실행 후 다시 끈다
  # (FundingProjectPublicIdBackfillRunner 참고, 영구 스케줄 잡 아님).
  migration:
    backfill-funding-project-public-id:
      enabled: ${ORDER_BACKFILL_FUNDING_PROJECT_PUBLIC_ID:false}

# 메트릭(#242). 관리 포트는 application-dev/prod.yml에서만 8081로 분리한다 — 로컬은 앱 포트를 같이 쓴다.
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      # Grafana Spring Boot 대시보드가 이 라벨로 서비스를 구분한다
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        # p95·p99 응답 시간을 보려면 히스토그램 버킷이 필요하다
        "[http.server.requests]": true
