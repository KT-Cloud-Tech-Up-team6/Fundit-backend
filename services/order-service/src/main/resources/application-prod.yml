spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

internal-api:
  key: ${INTERNAL_API_KEY}

order:
  integration:
    project-service:
      base-url: ${PROJECT_SERVICE_BASE_URL:http://project-service:8080}
    fulfillment-service:
      base-url: ${FULFILLMENT_SERVICE_BASE_URL:http://fulfillment-service:8080}
