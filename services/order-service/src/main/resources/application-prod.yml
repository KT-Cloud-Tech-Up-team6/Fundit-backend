spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

internal-api:
  key: ${INTERNAL_API_KEY}

order:
  integration:
    project-service:
      base-url: ${PROJECT_SERVICE_BASE_URL:http://project-service:8080}
    fulfillment-service:
      base-url: ${FULFILLMENT_SERVICE_BASE_URL:http://fulfillment-service:8080}
    payment-service:
      base-url: ${PAYMENT_SERVICE_BASE_URL:http://payment-service:8080}
    live-service:
      base-url: ${LIVE_SERVICE_BASE_URL:http://live-service:8080}

# 메트릭·헬스체크 전용 포트(#242). 인프라 PodMonitor·probe가 이 포트를 본다.
# application.yml에 두지 않는다 — 로컬에서 auth-service 앱 포트(8081)와 충돌한다.
management:
  server:
    port: 8081
