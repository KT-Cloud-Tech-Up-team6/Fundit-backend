spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

internal-api:
  key: ${INTERNAL_API_KEY}

toss:
  payments:
    secret-key: ${TOSS_WIDGET_SECRET_KEY}
    base-url: ${TOSS_BASE_URL:https://api.tosspayments.com}

payment:
  encryption:
    key: ${PAYMENT_ENCRYPTION_KEY}

# order-service 내부 API(GET /internal/fundings/{fundingId}) 연동 완료(order-service #74) —
# 기본값 http로 전환. 롤백 필요 시 ORDER_FUNDING_CLIENT_MODE=stub 환경변수로 되돌릴 것.
order:
  integration:
    funding-client:
      mode: ${ORDER_FUNDING_CLIENT_MODE:http}
    base-url: ${ORDER_SERVICE_BASE_URL:http://order-service:8080}

# fulfillment-service 내부 API(FULFILLMENT-008) 연동 완료 — 기본값 http로 전환.
# 롤백 필요 시 SHIPPING_STATUS_CLIENT_MODE=stub 환경변수로 되돌릴 것.
fulfillment:
  integration:
    shipping-status-client:
      mode: ${SHIPPING_STATUS_CLIENT_MODE:http}
    base-url: ${FULFILLMENT_SERVICE_BASE_URL:http://fulfillment-service:8080}

media:
  s3:
    bucket: ${MEDIA_S3_BUCKET}
    region: ${AWS_REGION}
