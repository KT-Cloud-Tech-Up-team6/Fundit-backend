spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate

internal-api:
  key: ${INTERNAL_API_KEY}

toss:
  payments:
    secret-key: ${TOSS_WIDGET_SECRET_KEY}

payment:
  encryption:
    key: ${PAYMENT_ENCRYPTION_KEY}

# order-service 내부 API(GET /internal/fundings/{fundingId})가 아직 없어 기본은 stub —
# 연동 완료 후 ORDER_FUNDING_CLIENT_MODE=http로 전환(dev와 동일 패턴).
order:
  integration:
    funding-client:
      mode: ${ORDER_FUNDING_CLIENT_MODE:stub}
    base-url: ${ORDER_SERVICE_BASE_URL:http://order-service:8080}
