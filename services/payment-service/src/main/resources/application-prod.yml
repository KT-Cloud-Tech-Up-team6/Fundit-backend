spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

internal-api:
  key: ${INTERNAL_API_KEY}

toss:
  payments:
    secret-key: ${TOSS_WIDGET_SECRET_KEY}
    base-url: ${TOSS_BASE_URL:https://api.tosspayments.com}

payment:
  encryption:
    key: ${PAYMENT_ENCRYPTION_KEY}

# order-service 내부 API(GET /internal/fundings/{fundingId})가 아직 없어 기본은 stub —
# 연동 완료 후 ORDER_FUNDING_CLIENT_MODE=http로 전환(dev와 동일 패턴).
order:
  integration:
    funding-client:
      mode: ${ORDER_FUNDING_CLIENT_MODE:stub}
    base-url: ${ORDER_SERVICE_BASE_URL:http://order-service:8080}

# fulfillment-service 내부 API(FULFILLMENT-008)는 이미 구현돼 있으나 기본은 stub로 시작 —
# 연동 확인 후 SHIPPING_STATUS_CLIENT_MODE=http로 전환(order 쪽과 동일 패턴).
fulfillment:
  integration:
    shipping-status-client:
      mode: ${SHIPPING_STATUS_CLIENT_MODE:stub}
    base-url: ${FULFILLMENT_SERVICE_BASE_URL:http://fulfillment-service:8080}
