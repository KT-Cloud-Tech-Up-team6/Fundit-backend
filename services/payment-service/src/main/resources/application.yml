server:
  port: 8080

spring:
  application:
    name: payment-service
  profiles:
    active: local
  jackson:
    default-property-inclusion: non_null
  # [수정] payment/refund/settlement 스키마는 V1__init_schema.sql이 직접 CREATE SCHEMA로
  # 만든다. spring.flyway.schemas에 이 목록을 넣으면 Flyway가 createSchemas(기본 true)로
  # 먼저 스키마를 만들어버려서, 마이그레이션 스크립트의 CREATE SCHEMA와 충돌해
  # "schema already exists"로 실패한다 — 다른 서비스와 동일하게 기본값(public)만 쓴다.
  flyway:
    schemas: public

# 하자환불 증빙 업로드 주소 발급(S3 Presigned URL, F09) — bucket/region은 시크릿이 아니지만
# 환경마다 달라 application-dev.yml/application-prod.yml에서 env로만 채운다(project-service와 동일 패턴).
media:
  upload:
    presign-ttl-minutes: 5
