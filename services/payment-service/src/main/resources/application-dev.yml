spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

internal-api:
  key: ${INTERNAL_API_KEY}

toss:
  payments:
    secret-key: ${TOSS_WIDGET_SECRET_KEY}
    base-url: ${TOSS_BASE_URL:https://api.tosspayments.com}

payment:
  encryption:
    key: ${PAYMENT_ENCRYPTION_KEY}

order:
  integration:
    funding-client:
      mode: ${ORDER_FUNDING_CLIENT_MODE:http}
    base-url: ${ORDER_SERVICE_BASE_URL:http://order-service:8080}

fulfillment:
  integration:
    shipping-status-client:
      mode: ${SHIPPING_STATUS_CLIENT_MODE:http}
    base-url: ${FULFILLMENT_SERVICE_BASE_URL:http://fulfillment-service:8080}

media:
  s3:
    bucket: ${MEDIA_S3_BUCKET}
    region: ${AWS_REGION}
  # 공개(CDN) 주소 — 업로드 주소 발급 시 fileUrl이 이 값 + S3 키로 조립된다.
  # S3 직접 주소를 내려주면 FE가 CDN(캐시·도메인 정책)을 우회하고, 인프라가 S3 직접 접근을
  # 막는 순간 이미지가 전부 깨진다. 공개 도메인이라 비밀이 아니므로 dev는 기본값을 둔다.
  public-base-url: ${MEDIA_PUBLIC_BASE_URL:https://infrastudy.store/media/}

# 메트릭·헬스체크 전용 포트(#242). 인프라 PodMonitor·probe가 이 포트를 본다.
# application.yml에 두지 않는다 — 로컬에서 auth-service 앱 포트(8081)와 충돌한다.
management:
  server:
    port: 8081
