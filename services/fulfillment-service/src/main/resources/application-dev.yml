spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

internal-api:
  key: ${INTERNAL_API_KEY}

# order-service 내부 API(GET /internal/fundings/{fundingId})가 실제로 배선되어 기본을 http로 켠다.
# 로컬에서 order-service 없이 이 서비스만 띄우고 싶으면 ORDER_FUNDING_CLIENT_MODE=stub로 되돌린다.
order:
  integration:
    funding-client:
      mode: ${ORDER_FUNDING_CLIENT_MODE:http}
    base-url: ${ORDER_SERVICE_BASE_URL:http://order-service:8080}

# project-service 내부 API(GET /internal/projects/{projectId})가 실제로 배선되어 기본을 http로 켠다.
# 로컬에서 project-service 없이 이 서비스만 띄우고 싶으면 PROJECT_OWNERSHIP_CLIENT_MODE=stub로 되돌린다.
project:
  integration:
    ownership-client:
      mode: ${PROJECT_OWNERSHIP_CLIENT_MODE:http}
    base-url: ${PROJECT_SERVICE_BASE_URL:http://project-service:8080}
