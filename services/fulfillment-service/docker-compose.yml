services:
  postgres:
    image: postgres:16
    container_name: fundit-fulfillment-service-postgres
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5438:5432"
    volumes:
      - fulfillment-service_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fundit-fulfillment-service-net

volumes:
  fulfillment-service_postgres_data:

networks:
  fundit-fulfillment-service-net:
