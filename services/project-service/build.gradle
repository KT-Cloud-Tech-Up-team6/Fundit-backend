dependencies {
    // common-webmvc가 api로 modules:common + spring-boot-starter-web을 같이 노출하므로 중복 선언 안 함
    implementation project(':modules:common-webmvc')
    // public_id(UUID v7) 생성용 — auth-service accounts.id 생성과 동일 라이브러리
    implementation 'com.github.f4b6a3:uuid-creator:6.1.0'
    // 이미지/영상 업로드 주소 발급(S3 Presigned URL, 할일 D) — S3Client(HeadObject)/S3Presigner(PUT)
    implementation platform('software.amazon.awssdk:bom:2.29.52')
    implementation 'software.amazon.awssdk:s3'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'

    // 리워드 이벤트(reward.created.v1/reward.updated.v1) 발행 — event-convention.md
    implementation 'org.springframework.kafka:spring-kafka'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testImplementation 'org.testcontainers:testcontainers-kafka'

    // 스토리 TEXT 블록의 굵게/색상/정렬 서식을 HTML로 저장하기 전 XSS 방지용 화이트리스트 정제(security.md S2)
    implementation 'org.jsoup:jsoup:1.18.1'
}

// 로컬 QA 전용. test 소스이므로 운영 bootJar에는 포함되지 않는다.
tasks.register('fundingStoryAiStub', JavaExec) {
    group = 'application'
    description = 'Run the loopback-only Funding Story AI stub (no model calls)'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.fundit.project.infrastructure.ai.stub.FundingStoryAiStubServer'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }
}
