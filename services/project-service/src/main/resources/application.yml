server:
  port: 8080

spring:
  application:
    name: project-service
  profiles:
    active: local
  jackson:
    default-property-inclusion: non_null

reward-event-outbox:
  worker-enabled: true
  poll-interval-ms: 5000
  batch-size: 50

# SEARCH-011 — project.approved.v1/project.updated.v1 발행용 아웃박스 워커.
project-index-event-outbox:
  worker-enabled: true
  poll-interval-ms: 5000
  batch-size: 50

# 펀딩 마감 감시(FundingDeadlineWatcher) — 대상 감지 주기. 마감 시각 판정용이라 초 단위로
# 촘촘할 필요는 없어 아웃박스 워커보다 느슨한 기본값(1분)을 둔다.
# batch-size: 한 주기에 마감이 몰려도 한 트랜잭션에서 전부 읽지 않도록 상한을 둔다 — 남은 건은
# 다음 주기(1분 뒤)에 마저 처리된다.
funding-deadline-watcher:
  poll-interval-ms: 60000
  batch-size: 200

# project.funding-deadline-reached.v1 발행용 아웃박스 워커.
funding-deadline-event-outbox:
  worker-enabled: true
  poll-interval-ms: 5000
  batch-size: 50

# 이미지/영상 업로드 주소 발급(S3 Presigned URL, 할일 D 확정 스펙) — bucket/region은 시크릿이
# 아니지만 환경마다 달라 application-dev.yml/application-prod.yml에서 env로만 채운다.
media:
  upload:
    presign-ttl-minutes: 5

# Funding Story AI는 FE 공개 경로와 같은 /api/v1/ai 경로를 사용한다.
# 최종 PNG와 공개 결과는 BE가 소유하며 별도 Funding Story DB/ERD는 추가하지 않는다.
funding-story:
  ai:
    base-url: ${FUNDING_STORY_AI_BASE_URL:http://localhost:8000}
    service-token: ${FUNDING_STORY_AI_SERVICE_TOKEN:local-funding-story-token}
    connect-timeout-ms: ${FUNDING_STORY_AI_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${FUNDING_STORY_AI_READ_TIMEOUT_MS:10000}
    stream-timeout-ms: ${FUNDING_STORY_AI_STREAM_TIMEOUT_MS:310000}
    read-url-ttl-minutes: ${FUNDING_STORY_AI_READ_URL_TTL_MINUTES:15}
    upload-url-ttl-minutes: ${FUNDING_STORY_AI_UPLOAD_URL_TTL_MINUTES:5}
    run-callback-timeout-minutes: ${FUNDING_STORY_AI_RUN_CALLBACK_TIMEOUT_MINUTES:30}

# 상세 페이지 AI 요약(#169) — 같은 AI 서버·토큰(funding-story.ai.*)을 쓴다.
# read-url-ttl-minutes: 본문 이미지 서명 URL 유효기간. 대기+폴링+재시도(최대 30분)보다 길어야 한다(AI팀 합의 60분).
page-summary:
  worker-enabled: true
  poll-interval-ms: 5000
  batch-size: 20
  read-url-ttl-minutes: 60

# 컨트롤러 8개가 대표 도메인을 공유하지 않아(다수가 @RequestMapping("/api/v1")만 두고
# 세부 경로를 메서드에서 지정) auth/member처럼 "그 서비스의 단일 리소스" 경로를 쓸 수 없다.
# 서비스명이자 가장 먼저 생기는 리소스인 projects를 대표로 삼는다.
springdoc:
  api-docs:
    path: /api/v1/projects/api-docs

# 메트릭(#242). 관리 포트는 application-dev/prod.yml에서만 8081로 분리한다 — 로컬은 앱 포트를 같이 쓴다.
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      # Grafana Spring Boot 대시보드가 이 라벨로 서비스를 구분한다
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        # p95·p99 응답 시간을 보려면 히스토그램 버킷이 필요하다
        "[http.server.requests]": true
