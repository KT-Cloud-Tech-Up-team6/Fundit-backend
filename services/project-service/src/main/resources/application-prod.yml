spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

media:
  s3:
    bucket: ${MEDIA_S3_BUCKET}
    region: ${AWS_REGION}

internal-api:
  key: ${INTERNAL_API_KEY}

project:
  integration:
    member-service:
      # 판매자 표시명(닉네임) 일괄 조회. 틀려도 화면은 정상이고 판매자명만 빠진다.
      base-url: ${MEMBER_SERVICE_BASE_URL:http://member-service:8080}

funding-story:
  ai:
    base-url: ${FUNDING_STORY_AI_BASE_URL}
    service-token: ${FUNDING_STORY_AI_SERVICE_TOKEN}
    require-https: true

order:
  integration:
    inventory-client:
      mode: ${INVENTORY_CLIENT_MODE:http}
    base-url: ${ORDER_SERVICE_BASE_URL:http://order-service:8080}

# 스펙은 공격자에게 좋은 지도라 운영에서는 닫는다. dev는 켜 둔다(프론트 전달용).
springdoc:
  api-docs:
    enabled: false
