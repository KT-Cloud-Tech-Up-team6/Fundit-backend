spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

media:
  s3:
    bucket: ${MEDIA_S3_BUCKET}
    region: ${AWS_REGION}
  # 공개(CDN) 주소 — 업로드 주소 발급 시 fileUrl이 이 값 + S3 키로 조립된다.
  # S3 직접 주소를 내려주면 FE가 CDN(캐시·도메인 정책)을 우회하고, 인프라가 S3 직접 접근을
  # 막는 순간 이미지가 전부 깨진다. 공개 도메인이라 비밀이 아니므로 dev는 기본값을 둔다.
  public-base-url: ${MEDIA_PUBLIC_BASE_URL:https://infrastudy.store/media/}

internal-api:
  key: ${INTERNAL_API_KEY}

project:
  integration:
    member-service:
      # 판매자 표시명(닉네임) 일괄 조회. 틀려도 화면은 정상이고 판매자명만 빠진다.
      base-url: ${MEMBER_SERVICE_BASE_URL:http://member-service:8080}

# order-service 재고 조회(GET /api/v1/inventories/{rewardId})는 이미 배선 완료 — dev는 실제 호출로 확인한다.
order:
  integration:
    inventory-client:
      mode: ${INVENTORY_CLIENT_MODE:http}
    base-url: ${ORDER_SERVICE_BASE_URL:http://order-service:8080}
