spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none

media:
  s3:
    bucket: ${MEDIA_S3_BUCKET}
    region: ${AWS_REGION}

internal-api:
  key: ${INTERNAL_API_KEY}
