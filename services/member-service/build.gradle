dependencies {
    // common-webmvc가 api로 modules:common + spring-boot-starter-web을 같이 노출하므로 중복 선언 안 함
    implementation project(':modules:common-webmvc')
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'

    // 찜 이벤트(project.wished.v1/project.unwished.v1) 발행 — event-convention.md
    // 자동구성이 아니라 KafkaProducerConfig에서 빈을 직접 만들므로 스타터가 아니라 spring-kafka로 충분하다
    implementation 'org.springframework.kafka:spring-kafka'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testImplementation 'org.testcontainers:testcontainers-kafka'
}
