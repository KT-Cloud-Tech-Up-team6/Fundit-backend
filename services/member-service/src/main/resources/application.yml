server:
  port: 8080

spring:
  application:
    name: member-service
  profiles:
    active: local
  jackson:
    default-property-inclusion: non_null

springdoc:
  api-docs:
    path: /api/v1/members/api-docs

# 이벤트 아웃박스 워커(MEMBER-002·005). project-service reward-event-outbox와 같은 키 모양이다.
member-event-outbox:
  worker-enabled: true
  poll-interval-ms: 5000
  batch-size: 50
