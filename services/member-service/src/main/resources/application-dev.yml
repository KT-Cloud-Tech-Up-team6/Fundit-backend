spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

internal-api:
  key: ${INTERNAL_API_KEY}

member:
  encryption:
    # 개인정보 컬럼 암호화 키(Base64 AES-256, 32바이트). 조회용 블라인드 인덱스도 같은 키를 쓴다.
    # 기본값을 두지 않는다 — 미설정이면 기동이 실패해야 한다. 임시 키로 흘러가면 기존 데이터를
    # 복호화하지 못하고, 그 사실을 저장 시점이 아니라 조회 시점에 알게 된다.
    key: ${MEMBER_ENCRYPTION_KEY}
