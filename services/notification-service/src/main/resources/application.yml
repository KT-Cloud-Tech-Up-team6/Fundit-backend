server:
  port: 8080

spring:
  application:
    name: notification-service
  profiles:
    active: local
  jackson:
    default-property-inclusion: non_null

  kafka:
    consumer:
      group-id: notification-service
      # auto.offset.reset은 "커밋된 오프셋이 없거나 그 오프셋이 더 이상 유효하지 않을 때"만 적용된다.
      # 정상 재기동은 커밋된 오프셋부터 이어 읽으므로 이 값과 무관하게 유실이 없다.
      # earliest를 고른 건 오프셋이 사라진 상황(그룹 재생성, retention 초과)에서
      # 알림을 건너뛰기보다 다시 읽는 쪽이 낫기 때문이다 — 중복은 (event_id, member_id) UNIQUE가 흡수한다.
      # [천장] 첫 기동 시 토픽에 남은 과거 알림을 전부 읽는다. 알림함에 오래된 항목이
      # 쌓이는 게 문제가 되면 latest 또는 by_duration 으로 바꾼다.
      auto-offset-reset: earliest
      # 브로커에서는 문자열로만 받는다. NotificationRaisedEvent로의 타입 변환은
      # KafkaConsumerConfig의 메시지 컨버터가 리스너 호출 전에 끝낸다 —
      # 모르는 필드 무시와 역직렬화 실패 처리도 그쪽(컨버터/에러 핸들러) 소관이다.
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

springdoc:
  api-docs:
    path: /api/v1/notifications/api-docs
