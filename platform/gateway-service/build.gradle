// 루트 build.gradle의 subprojects 블록이 java/jacoco/dependency-management 플러그인, Java 25 툴체인,
// Spring Boot·Cloud BOM, spring-boot-starter-test, Lombok, test/jacocoTestReport 태스크 설정까지 전부
// 적용한다. Spring Boot 플러그인(bootJar)도 platform/* 에 자동 적용된다
// (development-workflow-guide.md "자동 제공 항목 — 중복 선언 금지"). 여기선 이 모듈만의 의존성만 선언한다.
//
// spring-boot-starter-web / modules:common-webmvc는 선언하지 않는다 — 게이트웨이는 리액티브(WebFlux)
// 스택이라 Servlet MVC와 공존할 수 없다(CLAUDE.md). 에러 응답은 웹 프레임워크를 모르는
// modules:common의 ErrorResponse/CommonErrorCode만 사용한다.
dependencies {
    implementation project(':modules:common')

    implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // NimbusReactiveJwtDecoder만 필요해서 jose 라이브러리만 직접 가져온다.
    // spring-boot-starter-oauth2-resource-server를 쓰면 spring-boot-starter-security까지 딸려와
    // 원치 않는 시큐리티 필터체인이 자동 구성된다 — 인증 판단은 JwtHeaderGlobalFilter가 직접 한다.
    implementation 'org.springframework.security:spring-security-oauth2-jose'

    testImplementation 'io.projectreactor:reactor-test'
}
