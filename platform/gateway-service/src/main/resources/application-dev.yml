downstream:
  auth-service-base-url: ${AUTH_SERVICE_BASE_URL}
  member-service-base-url: ${MEMBER_SERVICE_BASE_URL}
  payment-service-base-url: ${PAYMENT_SERVICE_BASE_URL}
  fulfillment-service-base-url: ${FULFILLMENT_SERVICE_BASE_URL}
  order-service-base-url: ${ORDER_SERVICE_BASE_URL}
  project-service-base-url: ${PROJECT_SERVICE_BASE_URL}
  search-service-base-url: ${SEARCH_SERVICE_BASE_URL}
  notification-service-base-url: ${NOTIFICATION_SERVICE_BASE_URL}
  live-service-base-url: ${LIVE_SERVICE_BASE_URL}

jwt:
  # auth-service가 공개키를 노출하는 곳. downstream 주소를 재사용해 환경변수를 늘리지 않는다.
  jwk-set-uri: ${downstream.auth-service-base-url}/api/v1/auth/jwks

# 다운스트림 서비스들과 동일한 값이어야 한다.
internal-api:
  key: ${INTERNAL_API_KEY}

# 메트릭·헬스체크 전용 포트(#242). 인프라 PodMonitor·probe가 이 포트를 본다.
# application.yml에 두지 않는다 — 로컬에서 auth-service 앱 포트(8081)와 충돌한다.
management:
  server:
    port: 8081
