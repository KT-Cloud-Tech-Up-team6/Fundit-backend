server:
  port: 8080

spring:
  application:
    name: gateway-service
  profiles:
    active: local
  jackson:
    default-property-inclusion: non_null
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${downstream.auth-service-base-url}
              predicates:
                - Path=/api/v1/auth/**
            # POST /api/v1/members(내부 전용)는 이 패턴에 걸리지만 JwtHeaderGlobalFilter가 404로 끊는다.
            # 라우트 정의만으로는 분리가 안 된다 — 필터 주석 참고.
            - id: member-service
              uri: ${downstream.member-service-base-url}
              predicates:
                - Path=/api/v1/members/**,/api/v1/wishes/**,/api/v1/addresses/**,/api/v1/terms/**
            # 웹훅(/api/v1/payments/webhook/toss)은 토스 서버가 Authorization 헤더 없이 직접
            # 호출한다 — 위 필터가 토큰이 없으면 X-User-Id 없이 그대로 통과시키므로 별도 예외
            # 처리가 필요 없다(payment-service InternalGatewaySecretFilter가 서명 검증 없이
            # 통과시키고, 실제 위조 방지는 TossWebhookService의 secret 대조가 담당).
            - id: payment-service
              uri: ${downstream.payment-service-base-url}
              predicates:
                - Path=/api/v1/payments/**,/api/v1/refunds/**,/api/v1/settlements/**
            # GET /internal/fundings/{fundingId}/fulfillment-status(내부 전용)는 이 패턴에
            # 걸리지 않는다 — 별도 prefix(/internal/**)라 fulfillment-service 라우트 자체가
            # 안 걸리므로 JwtHeaderGlobalFilter의 404 차단을 확인하려면 그 경로를 이 라우트에도
            # 추가해야 한다(현재는 라우팅되지 않아 프록시 자체가 안 됨 — 별도 이슈로 남겨둠).
            # project-service 라우트를 나중에 넓게(예: Path=/api/v1/projects/**) 추가할 때는
            # 이 라우트보다 뒤에 정의할 것 — Spring Cloud Gateway는 정의 순서대로 첫 매치를
            # 취하므로, 더 구체적인 이 predicate가 먼저 와야 fulfillment 요청을 가로채지 않는다.
            - id: fulfillment-service
              uri: ${downstream.fulfillment-service-base-url}
              predicates:
                - Path=/api/v1/projects/*/fulfillment/**,/api/v1/projects/*/fundings/*/shipment/**

management:
  endpoints:
    web:
      exposure:
        include: health
