server:
  port: 8080

spring:
  application:
    name: gateway-service
  profiles:
    active: local
  jackson:
    default-property-inclusion: non_null
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${downstream.auth-service-base-url}
              predicates:
                - Path=/api/v1/auth/**
            # POST /api/v1/members(내부 전용)는 이 패턴에 걸리지만 JwtHeaderGlobalFilter가 404로 끊는다.
            # 라우트 정의만으로는 분리가 안 된다 — 필터 주석 참고.
            - id: member-service
              uri: ${downstream.member-service-base-url}
              predicates:
                - Path=/api/v1/members/**,/api/v1/wishes/**,/api/v1/addresses/**,/api/v1/terms/**
            # 웹훅(/api/v1/payments/webhook/toss)은 토스 서버가 Authorization 헤더 없이 직접
            # 호출한다 — 위 필터가 토큰이 없으면 X-User-Id 없이 그대로 통과시키므로 별도 예외
            # 처리가 필요 없다(payment-service InternalGatewaySecretFilter가 서명 검증 없이
            # 통과시키고, 실제 위조 방지는 TossWebhookService의 secret 대조가 담당).
            - id: payment-service
              uri: ${downstream.payment-service-base-url}
              predicates:
                - Path=/api/v1/payments/**,/api/v1/refunds/**,/api/v1/settlements/**,/api/v2/payments/**,/api/v2/refunds/**
            # GET /internal/fundings/{fundingId}/fulfillment-status(내부 전용)는 이 패턴에
            # 걸리지 않는다 — 별도 prefix(/internal/**)라 fulfillment-service 라우트 자체가
            # 안 걸리므로 JwtHeaderGlobalFilter의 404 차단을 확인하려면 그 경로를 이 라우트에도
            # 추가해야 한다(현재는 라우팅되지 않아 프록시 자체가 안 됨 — 별도 이슈로 남겨둠).
            # order-service/project-service 라우트는 반드시 이 라우트보다 뒤에 정의한다 —
            # Spring Cloud Gateway는 정의 순서대로 첫 매치를 취하므로, 더 구체적인 이 predicate가
            # /api/v1/projects/*/fulfillment/** 요청을 project-service 캐치올보다 먼저 가로채야 한다.
            - id: fulfillment-service
              uri: ${downstream.fulfillment-service-base-url}
              predicates:
                - Path=/api/v1/projects/*/fulfillment/**,/api/v1/projects/*/fundings/*/shipment/**,/api/v2/projects/*/fulfillment/**,/api/v2/projects/*/fundings/*/shipment/**
            - id: order-service
              uri: ${downstream.order-service-base-url}
              predicates:
                - Path=/api/v1/orders/**,/api/v1/coupons/**,/api/v1/reward-restock-notifications/**,/api/v1/projects/*/supporters/**,/api/v1/projects/*/orders/**,/api/v1/sellers/coupons/**
            # project-service보다 반드시 먼저 온다 — /api/v1/projects/*/supporters, /api/v1/projects/*/orders, /api/v1/sellers/coupons가
            # project-service의 /api/v1/projects/**, /api/v1/sellers/** 캐치올과 겹치기 때문
            # (정의 순서 = 첫 매치 우선, 위 fulfillment-service와 같은 이유).
            # GET /api/v1/inventories/{rewardId}는 의도적으로 라우트에 넣지 않는다 — project-service가
            # 잔여재고를 동기 조회하는 서비스 간 전용 엔드포인트(InventoryController 주석 참고, 인증 없음)라
            # 외부에 노출하면 안 된다.
            - id: project-service
              uri: ${downstream.project-service-base-url}
              predicates:
                - Path=/api/v1/projects/**,/api/v1/admin/projects/**,/api/v1/community/**,/api/v1/ai/**,/api/v1/live-verifications/**,/api/v1/notices/**,/api/v1/rewards/**,/api/v1/sellers/**
            # search-service는 project-service의 /api/v1/sellers/** 캐치올과 경로가 겹치지 않는다
            # (판매자 탭 검색은 /api/v1/search/sellers) — 정의 순서와 무관하게 안전하다.
            - id: search-service
              uri: ${downstream.search-service-base-url}
              predicates:
                - Path=/api/v1/home/**,/api/v1/categories/**,/api/v1/search/**

management:
  endpoints:
    web:
      exposure:
        include: health
