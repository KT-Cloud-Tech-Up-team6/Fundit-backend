# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "ko-KR"
early_access: false

tone_instructions: |
  이 저장소는 fundit-backend(Spring Boot 4.1.1 / Java 25, Gradle 멀티모듈 MSA)입니다.
  코드 리뷰는 아래 path_instructions에 명시된 팀 컨벤션(.claude/rules/*.md 기준)을 근거로 하고,
  근거 없는 추측성 지적은 피하고 실제로 컨벤션·버그·보안 문제가 되는 부분만 짚어주세요.

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false

  path_filters:
    - "**/*.java"
    - "**/*.gradle"
    - "**/*.yml"
    - "**/*.yaml"
    - "**/Dockerfile"
    - "!**/build/**"
    - "!**/.gradle/**"
    - "!gradle/wrapper/**"
    - "!**/src/main/resources/db/migration/**"   # 기존 마이그레이션 파일은 새 버전만 추가되므로 리뷰 노이즈 제외

  path_instructions:
    - path: "**/domain/**"
      instructions: |
        persistence-convention.md 기준으로 리뷰:
        - 애그리거트가 불변식/상태전이/동시성 제어 로직을 가지면 "복잡" 분류 — JPA/Spring 애노테이션(@Entity, @Column, @Component 등)이
          domain 클래스에 붙어 있으면 반드시 지적 (infrastructure에서만 매핑해야 함)
        - "단순" 애그리거트(로직 없이 저장/조회만)인데 불필요하게 Mapper/PersistenceAdapter/포트 인터페이스를 만들었으면 과설계로 지적
        - 애매하면 "복잡"으로 분류하는 게 컨벤션 — 반대로 가는 PR은 근거를 물어볼 것

    - path: "**/infrastructure/persistence/**"
      instructions: |
        persistence-convention.md 기준:
        - 복잡한 애그리거트는 {Aggregate}JpaEntity/{Aggregate}JpaRepository/{Aggregate}Mapper/{Aggregate}PersistenceAdapter 4파일 구조 확인
        - Mapper는 package-private(접근제한자 없음)이어야 함 — public이면 지적
        - JpaEntity는 Setter 없이 @Builder + @AllArgsConstructor(PRIVATE) + @NoArgsConstructor(PROTECTED) 패턴인지 확인
        - createdAt은 @PrePersist에서만, updatedAt은 @PreUpdate에서만 설정하는지 확인
        - 존재 확인 메서드명이 existsBy...(3인칭 단수 -s 포함)인지 확인 — existBy... 같은 오타 지적
        - 목록/검색 전용 조회에서 도메인 재구성 없이 Spring Data 프로젝션(query/ 하위)을 쓰고 있으면 정상 — 지적하지 말 것

    - path: "**/application/**"
      instructions: |
        error-handling.md 기준:
        - 비즈니스 규칙 위반을 raw Exception이나 RuntimeException으로 던지고 있으면 BusinessException(ErrorCode)로 바꾸라고 지적
        - modules:common의 CommonErrorCode에 이미 있는 코드(INVALID_INPUT, UNAUTHORIZED, NOT_FOUND 등)를
          도메인 ErrorCode로 재정의하고 있으면 지적
        - 도메인 ErrorCode는 서비스당 enum 하나로 시작하는 게 컨벤션 — 특별한 이유 없이 서브도메인별로
          미리 쪼개고 있으면 왜 필요한지 물어볼 것(대략 10개 이상 되거나 별도 담당자가 생기면 분리는 정당함)
        - 서비스 간 동기 호출에 타임아웃이 없으면 반드시 지적 (CLAUDE.md 주의사항)

    - path: "**/domain/exception/**"
      instructions: |
        - ErrorCode 인터페이스(getCode/getHttpStatus/getMessage)를 구현하는 enum인지 확인
        - getCode()를 별도 필드로 중복 저장하고 있으면(enum 상수 이름과 항상 같은 값) 불필요한 중복이라고 지적 — name() 그대로 쓰면 됨
        - httpStatus/message에 Lombok @Getter를 안 쓰고 수동으로 getter를 작성했으면 (프레임워크 종속 아니므로 허용된 관례라) 굳이 지적할 필요는 없음, 다만 @Getter로 줄일 수 있다는 제안 정도는 가능

    - path: "**/infrastructure/**"
      instructions: |
        error-handling.md 기준:
        - 외부 연동(PG, AI, 스트리밍, 다른 서비스 API 등) 호출부에서 예외를 그대로 던지거나 삼키고 있으면
          DependencyFailureException으로 감싸라고 지적
        - 컨트롤러가 아닌 계층에서 예외 스택트레이스를 그대로 로그에 남기며 비밀번호/토큰/개인정보가 같이 찍히고 있으면 반드시 지적 (security.md S10)

    - path: "**/modules/common/**"
      instructions: |
        CLAUDE.md 기준: 이 모듈에는 ErrorCode/CommonErrorCode/BusinessException/DependencyFailureException/ErrorResponse 같은
        에러·응답 계약 클래스만 있어야 함. 도메인/비즈니스 로직이나 특정 서비스 전용 코드가 추가되면 반드시 지적.
        Servlet/WebFlux 등 웹 프레임워크 의존성이 추가되면(예: spring-webmvc import) modules:common-webmvc로 옮기라고 지적.

    - path: "**/modules/common-webmvc/**"
      instructions: |
        Servlet 기반(Spring MVC) 서비스 전용 모듈. org.springframework.web.reactive.* (WebFlux) 관련 코드가
        섞여 들어오면 지적 — 공존 불가하며 필요하면 modules:common-webflux를 별도로 만들어야 함.
        org.springframework.web.ErrorResponse(Spring 자체 인터페이스)를 import하면 com.fundit.common.error.ErrorResponse와
        이름이 충돌하니 반드시 지적.

    - path: "**/presentation/controller/**"
      instructions: |
        api-convention.md 기준:
        - 컨트롤러에 비즈니스 로직이 들어가 있으면 지적 (요청 검증 + 애플리케이션 서비스 호출 + 응답 변환만 허용)
        - 컨트롤러에서 직접 try-catch로 에러 응답을 조립하고 있으면 지적 — GlobalExceptionHandler가 처리해야 함
        - 도메인 엔티티를 응답으로 그대로 반환하고 있으면 지적 — presentation/dto의 응답 DTO를 거쳐야 함
        - URL이 kebab-case가 아니거나 /api/v1/ 프리픽스가 없으면 지적
        - security.md S4: id 파라미터만으로 리소스 접근을 허용하고 소유권 검증이 빠져 있으면 반드시 지적

    - path: "**/presentation/dto/**"
      instructions: |
        - 요청 DTO에 @Valid 기반 검증(Bean Validation)이 없으면 지적 (security.md S2 — 서버 측 검증 필수)
        - 목록 조회 응답이 페이지네이션 형태인데 PageResponse<T> 표준 포맷을 안 쓰고 있으면 지적

    - path: "**/src/test/**"
      instructions: |
        test-convention.md 기준:
        - 테스트 메서드명이 한국어 `{조건}_{기대결과}()` 패턴이 아니면 지적 (예: 재고가_충분하면_정상_차감된다)
        - 정상 케이스와 예외 케이스가 한 파일(OrderServiceTest)에 섞여 있고 별도 ExceptionTest로 안 나뉘어 있으면 지적
        - given-when-then 주석 구분이 없으면 지적
        - 통합 테스트에서 실제 쓰는 외부 인프라(DB 등)를 Mock으로 대체하고 있으면 지적 — Testcontainers를 써야 함
        - 동시성이 걸리는 로직(재고 차감, 락 등)을 일반 단위 테스트로만 검증하고 있으면 별도 ConcurrencyTest 필요하다고 제안

    - path: "**/src/main/resources/application*.yml"
      instructions: |
        config-convention.md 기준:
        - 비밀번호/키 값이 하드코딩되어 있으면(환경변수 참조 ${} 형태가 아니면) 반드시 지적 (security.md S9)
        - application-prod.yml 변경이 PR에 포함되어 있으면 "배포 파이프라인에서만 관리" 원칙 위반이라고 지적 (CLAUDE.md)
        - ddl-auto가 prod에서 validate가 아니거나 local/dev에서 none이 아니면 지적

    - path: "**/Dockerfile"
      instructions: |
        config-convention.md 기준:
        - 멀티스테이지 빌드가 아니면 지적
        - 최종 이미지가 JDK가 아니라 JRE 기반인지 확인
        - 컨테이너를 root로 실행하고 있으면(USER 지정 없음) 반드시 지적
        - base 이미지가 eclipse-temurin:25 계열이 아니면 지적

    - path: "**/*.java"
      instructions: |
        security.md 전역 체크(해당 코드에 관련 있을 때만):
        - S1: 외부 입력을 SQL 문자열에 직접 결합(문자열 concat으로 쿼리 조립)하고 있으면 반드시 지적
        - S3: 비밀번호를 평문/단순 해시로 저장하고 있으면 반드시 지적
        - S4: 클라이언트가 보낸 역할·권한 값을 그대로 신뢰하는 코드가 있으면 반드시 지적
        - S5/S6: 업로드 확장자 미검증, 다운로드 경로에 사용자 입력을 직접 사용(경로순회 가능)하면 지적
        - S7: 서버가 요청할 외부 URL을 사용자 입력으로 직접 받고 있으면 지적

  # 다른 fundit-backend 저장소가 생기면 공용 리뷰 기준을 여기서 참조하도록 확장 가능
  # remote_config:
  #   repository: "fundit-org/coderabbit-shared-config"
  #   ref: "main"
  #   path: ".shared-coderabbit.yaml"

chat:
  auto_reply: true